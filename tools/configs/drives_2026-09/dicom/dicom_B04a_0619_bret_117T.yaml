# Historical drives, DICOM stream (stream B), group B04a: protocol 0619 hypoxia +
# ethidium bromide ("BrEt"), 2020-02-24, mice 17/18/19/22, Bruker BioSpec 11.7T.
# Review: tasks/drives_dicom_review.md (group B04). Inventory: _analysis\drives-dicom\inventory.csv.
#
# WHY: pre-2022 (before the kenia retention horizon), so it exists only here.
# Source: drive 1 `Cardiac MRI.zip` -> `Cardiac MRI/Proyecto 0619 (Ratones Hipoxia)/BrEt/`
# and `BrEt/DICOM/` (the same sessions twice; deduplicated PER EXAM, the copy with
# DICOM + fid wins). Facility DB: each mouse has "MRI 11.7T" logged on 2020-02-24;
# ACQ_station is `BIOSPEC 500` (500 MHz 1H = 11.7 T).
#
# STAGING: the canonical exams are copied out of the zip into a FLAT
#     D:/projects/gjesus3/scratch_drives-dicom/stage_B04/<study>/<exam>/
# so original_name = "<study>/<exam>", the same shape as every production MRI row
# (the staging_dir dedup trap, mri_1019_*.yaml). The copy is scratch; it is deleted
# after the batch is verified.
#
# REGEX: the study token has no protocol code (`jrc200224_m17_hpyoxBE2`,
# `jrc200224_m18_hypoxBE`), so it matches neither shared regex (the D3 silent skip).
# This config's regex is SCOPED by `pattern` to the 2020-02-24 studies only; the
# shared regex is not changed. The protocol 0619 comes from the folder claim
# (`Proyecto 0619`), confirmed by the facility DB, and is set literally below.
#
# MODEL: set EXPLICITLY. paravision_metadata._scanner_model turns `BIOSPEC 500`
# into "Bruker BioSpec 50T" (a bug, BACKLOG); never rely on it for this scanner.
#
# Expected: 4 studies, 67 exams (all with DICOM). Dry run:
#   python tools/ingest_raw.py --config tools/configs/drives_2026-09/dicom/dicom_B04a_0619_bret_117T.yaml --nas-root J:/gjesus3-data --dry-run

ingest:
  delete_source_after_ingest: false
  auto_create_projects: false             # AE-biomaGUNE-0619 = PROJ-0004 exists (active)
  acquisition_layout: folder
  copy_strategy: mri_paravision_v2        # DICOMs only
  reconstructions: all

auto_discover:
  staging_dir: "D:/projects/gjesus3/scratch_drives-dicom/stage_B04"
  pattern: "20200224_*/[0-9]*"
  filename_parse:
    source: parent_name
    regex: '(?P<jrc_id>(?P<pi_initials>jrc)\d{6}_m(?P<animal_num>\d+)_[A-Za-z0-9]+)'
  # Per-exam acquisition datetime (cases_<config>.csv, keyed on original_name):
  # visu_pars VisuCreationDate, the value production uses, else the scanner-written
  # acqp ACQ_time. Without it an exam with no visu_pars would get TODAY as its
  # date (the ingest's soft fallback; found in this stream's B06 dry run).
  case_table:
    file:       cases_dicom_B04a_0619_bret_117T.csv
    key:        original_name
    on_missing: error
  subject_from_db: true
  subject_lookup:
    project_alias: "0619"
    animal_code:   "${discovered.animal_num}"

registry:
  instrument:           MRI
  data_ecosystem:       DICOM
  instrument_model:     "Bruker BioSpec 11.7T"
  modalities_in_study:  NA
  researcher:           "NA"
  data_source:          internal
  sample_id:            "m${discovered.animal_num}_0619"
  sample_type:          organism
  session_id:           "${discovered.jrc_id}"
  acquisition_datetime: discovered.drv_acq_datetime
  project_name:         "AE-biomaGUNE-0619"
  notes:                "Internal MRI ${discovered.mri_sequence_name} exam ${discovered.mri_exam_number} (animal m${discovered.animal_num}, protocol 0619 from folder claim); recons kept: ${discovered.mri_recon_indices}; historical drives (drive 1 Cardiac MRI.zip, BrEt), predates the kenia retention horizon"

operator: "NA"
