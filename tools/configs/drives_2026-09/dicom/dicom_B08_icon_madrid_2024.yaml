# Historical drives, DICOM stream (stream B), group B08: Claudia's "Madrid 29-04-2024", an
# external Bruker ICON (1 T benchtop; ACQ_station `ICON`, 1H 44.69 MHz, PV 6.0.1pl3_ICON;
# ACQ_institution "Uni Madrid"), 2024-04-23..26, 4 mice ("Raton-JRC-01".."-04"), study
# "nanoparticulas". Review: tasks/drives_dicom_review.md (group B08, Q4).
# Approved in principle (Ryan via the coordinator, 2026-10-02): ingest as XMRI collaborator data.
#
# SHAPE: one row per SCAN (ParaVision exam), the internal-MRI convention, NOT one archive per
# session (BACKLOG 🔺 "external collaborator archives are one row per EXAM, not per series").
# copy_strategy mri_paravision_v2 stores DICOMs only. These scans have NONE, so each gets the
# empty .data/ placeholder + a regen worklist row; regeneration must run from this same staging
# BEFORE it is deleted (the worklist's re-pull-from-platform assumption does not hold for drive
# data). instrument XMRI (external MR), instrument_model "Bruker ICON 1T".
#
# SUBJECT: not in our animal-facility DB (scanned elsewhere), so subject_from_db is off. sample_id
# and session use the scanner's SUBJECT_id (I01Tdnrn01 .. I01Tdprn04). ⚠️ One study,
# 20240424_120501_I01Tdnrn01_1_2, has SUBJECT_id I01Tdnrn02 / label Raton-JRC-02 while its
# FOLDER says nrn01: the subject file's two fields agree and are used; flagged for Claudia.
#
# STAGING: HARD LINKS on D: (0 bytes), flat <study>/<exam>:
#     D:/projects/gjesus3/scratch_drives-dicom/stage_B08/
# data_source `collaborator:Uni-Madrid` is taken from ACQ_institution; confirm the wording.
#
#   python tools/ingest_raw.py --config tools/configs/drives_2026-09/dicom/dicom_B08_icon_madrid_2024.yaml --nas-root J:/gjesus3-data --dry-run

ingest:
  delete_source_after_ingest: false
  auto_create_projects: false
  acquisition_layout: folder
  copy_strategy: mri_paravision_v2
  reconstructions: all

auto_discover:
  staging_dir: "D:/projects/gjesus3/scratch_drives-dicom/stage_B08"
  pattern: "*/[0-9]*"
  case_table:
    file:       cases_dicom_B08_icon_madrid_2024.csv
    key:        original_name
    on_missing: error
  subject_from_db: false

registry:
  instrument:           XMRI
  data_ecosystem:       DICOM
  instrument_model:     "Bruker ICON 1T"
  modalities_in_study:  MR
  researcher:           "NA"
  data_source:          "collaborator:Uni-Madrid"
  sample_id:            discovered.drv_subject
  sample_type:          organism
  session_id:           discovered.drv_session
  acquisition_datetime: discovered.drv_acq_datetime
  project_name:         ""
  notes:                "External MRI (Bruker ICON 1T, Uni Madrid) ${discovered.mri_sequence_name} exam ${discovered.drv_exam}, mouse ${discovered.drv_label} (scanner id ${discovered.drv_subject}); study 'nanoparticulas'; historical drives (drive 1 Claudia/Madrid 29-04-2024)"

subject:
  facility_animal_id:  ""
  species:             "Mus musculus"
  source:              "paravision-subject"

operator: "NA"

link_filename: "XMRI_${discovered.drv_session}_${discovered.drv_exam}"
