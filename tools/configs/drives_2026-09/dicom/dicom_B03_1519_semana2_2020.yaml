# Historical drives, DICOM stream (stream B), group B03: protocol 1519 (Santander),
# post-surgery week 2, 2020-09-23/24, rats 14-26, Bruker BioSpec 7T.
# Review: tasks/drives_dicom_review.md (group B03, question Q1). Inventory: _analysis\drives-dicom\inventory.csv.
#
# WHY: pre-2022 (before the kenia retention horizon), so it exists only here. It is
# the ONLY week of the 2020 1519 rat study whose raw survives on the drives: the
# baseline and weeks 1, 3, 4 (~83 sessions) are present only as Splits/
# Segmentaciones derivatives (review §6). Facility DB: "MRI 7T" logged on the day
# for every rat (rat 20 the next day; its session started 20:31).
#
# ⚠️ PROJECT: AE-biomaGUNE-1519 = PROJ-0008 is CLOSED. Do not run for real until
# Ryan decides Q1.
#
# STAGING: canonical exams copied out of `Cardiac MRI.zip`
# (`Cardiac MRI/Proyecto 1519 Santander/Semana 2/Dicom/`) into a FLAT
#     D:/projects/gjesus3/scratch_drives-dicom/stage_B03/<study>/<exam>/
#
# REGEX: `jrc200923_m14_postcirugw2_1519` matches neither shared regex (D3).
# Scoped by `pattern` to the `_postcirugw2_1519` studies.
#
# KNOWN SKIP (1 exam): `20200923_162311_jrc200923_m14_postcirugw2_1519_1_1/8` holds
# ONLY pdata/1/dicom/ (30 .dcm, no acqp/method), so the ParaVision detector skips it.
# It is listed in inventory.csv as `pv_dicom_only_exam`; it needs a one-off decision
# (ingest as a DICOM folder, or record as not ingested).
#
# Expected: 10 studies, 135 exams listed (all with DICOM) + the 1 known skip. Dry run:
#   python tools/ingest_raw.py --config tools/configs/drives_2026-09/dicom/dicom_B03_1519_semana2_2020.yaml --nas-root J:/gjesus3-data --dry-run

ingest:
  delete_source_after_ingest: false
  auto_create_projects: false
  acquisition_layout: folder
  copy_strategy: mri_paravision_v2        # DICOMs only
  reconstructions: all

auto_discover:
  staging_dir: "D:/projects/gjesus3/scratch_drives-dicom/stage_B03"
  pattern: "*_postcirugw2_1519_1_1/[0-9]*"
  filename_parse:
    source: parent_name
    regex: '(?P<jrc_id>(?P<pi_initials>jrc)\d{6}_m(?P<animal_num>\d+)_postcirugw\d_(?P<project_code>\d{4}))'
  # Per-exam acquisition datetime (cases_<config>.csv, keyed on original_name):
  # visu_pars VisuCreationDate, the value production uses, else the scanner-written
  # acqp ACQ_time. Without it an exam with no visu_pars would get TODAY as its
  # date (the ingest's soft fallback; found in this stream's B06 dry run).
  case_table:
    file:       cases_dicom_B03_1519_semana2_2020.csv
    key:        original_name
    on_missing: error
  subject_from_db: true
  subject_lookup:
    project_alias: "${discovered.project_code}"
    animal_code:   "${discovered.animal_num}"

registry:
  instrument:           MRI
  data_ecosystem:       DICOM
  instrument_model:     "Bruker BioSpec 7T"
  modalities_in_study:  NA
  researcher:           "NA"
  data_source:          internal
  sample_id:            "m${discovered.animal_num}_${discovered.project_code}"
  sample_type:          organism
  session_id:           "${discovered.jrc_id}"
  acquisition_datetime: discovered.drv_acq_datetime
  project_name:         "AE-biomaGUNE-${discovered.project_code}"
  notes:                "Internal MRI ${discovered.mri_sequence_name} exam ${discovered.mri_exam_number} (animal m${discovered.animal_num}, protocol ${discovered.project_code}); recons kept: ${discovered.mri_recon_indices}; historical drives (drive 1 Cardiac MRI.zip, Semana 2), predates the kenia retention horizon"

operator: "NA"
