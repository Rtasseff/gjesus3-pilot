# The M. Jesus drive (third historical drive), stream M, part 2, batch P01: the CNIC pig images (study label HEARDS).
# Gate: tasks/drive3_mri_gate.md (Part 2). Ryan, 2026-10-06: "We should log the reconstructed images with any metadata
# appropriate for a metadata sidecar as xmri ingests. those ingests and the segmentations need to be assigned a project
# ... we can just make up a project name" -> project CNIC-HEARDS (created first, with tools/create_project.py).
#
# WHAT: Philips Achieva 3T at CNIC (Madrid), 2014-02-21 .. 07-16, 6 pigs, 13 scanner sessions, 27 phase-contrast flow
# series (magnitude + velocity map). Not a gjesus3 instrument: XMRI, collaborator:CNIC. Every header was read
# (mri_20_pig_probe.py): patient name and id are the pig codes, sex F, no species tag; nothing suggests human data.
#
# ROW UNIT: one row per exported series folder = one image series (+ the companion objects the scanner exported with
# it: an instance of the study's Raw Data Storage object, two presentation states in one folder); session_id = the
# scanner study (pig + session). The internal-MRI unit (BACKLOG: "external collaborator archives are one row per EXAM,
# not per series"), so a series is addressable and file_count means DICOM files on disk, as on every MRI row.
# Not registered (stream P places them with the masks in CNIC-HEARDS): DICOMDIR, Split\ (derived), and four MATLAB
# files named folders.cache / thumbs.cache.
#
# STAGING: D:/projects/gjesus3/drive3_streams/mri/stage/P01/<series folder>/<instance>, hard links of stage/PIG (each
# file checked against the drive manifest's SHA-256 when staged; mri_21_pig_rows.py).
# Generic DICOM shape (as X1, drives 1+2): files under <ACQ-ID>/series/, a curated `dicom` sidecar block (allow-list;
# PatientName and PatientBirthDate are never copied, tools/ingest/dicom_headers.py).
#
#   python tools/ingest_raw.py --config tools/configs/drive3_mri/drive3_mri_P01_cnic_heards.yaml --nas-root J:/gjesus3-data --dry-run

ingest:
  delete_source_after_ingest: false
  auto_create_projects: false             # CNIC-HEARDS is created beforehand with tools/create_project.py

auto_discover:
  staging_dir: "D:/projects/gjesus3/drive3_streams/mri/stage/P01"
  pattern: "*/"
  dicom_headers: true
  case_table:
    file:       cases_P01.csv
    key:        original_name
    on_missing: error
  subject_from_db: false                  # not our animals: no facility id

registry:
  instrument:           XMRI
  data_ecosystem:       DICOM
  instrument_model:     "${discovered.drv_model}"
  modalities_in_study:  MR
  researcher:           "NA"
  data_source:          "collaborator:CNIC"
  sample_id:            "${discovered.drv_sample}"
  sample_type:          organism
  session_id:           "${discovered.drv_session}"
  acquisition_datetime: discovered.drv_acq_datetime
  project_name:         "CNIC-HEARDS"
  notes:                "${discovered.drv_note}"

subject:
  facility_animal_id:  ""
  species:             "Sus scrofa"
  sex:                 "${discovered.drv_sex}"
  source:              "dicom-header"

anatomy:
  is_whole_body: false
  region:
    label:    heart
    ontology: UBERON
    id:       UBERON:0000948

operator: "NA"

link_filename: "XMRI_${discovered.drv_session}_${discovered.drv_series}"
