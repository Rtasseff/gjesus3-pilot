[gjesus3]
# MacMounter entry: keeps gjesus3 mounted on the NI Mac for the NI live sync.
# Data Office (Ryan Tasseff), 2026-10-08. INTERIM, with the Data Office login, until Box A pulls
# the data through the tunnel and this mount is retired (tasks/RESUME_ni_live.md, section 0 step 2).
# Installed by setup.sh, removed by undo.sh (both in gnuclear 2026/Jesus/Ryan/gjesus3-mount/).
# Race-safe on purpose: three MacMounter copies run on this Mac and all read this folder, so the
# old mount is force-unmounted only when it is listed but its registries folder cannot be reached.
# The password is read from the login keychain at mount time (mount_smbfs does not look it up
# itself) and URL-encoded; it is never written to a file or to MacMounter's log.
RECHECK_INTERVAL_SECONDS=120
PING_CMD=/usr/bin/nc -z -G 3 10.10.1.73 445
MOUNT_TEST_CMD=/bin/test -d /Users/molecubes/.gjesus3/gjesus3-data/registries
PRE_MOUNT_CMD=/sbin/mount | /usr/bin/grep -q " on /Users/molecubes/.gjesus3 (" && /sbin/umount -f /Users/molecubes/.gjesus3; /bin/mkdir -p /Users/molecubes/.gjesus3
MOUNT_CMD=/sbin/mount_smbfs -N -o nobrowse "//rtasseff:$(/usr/bin/security find-internet-password -a rtasseff -s 10.10.1.73 -w | /usr/local/bin/python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read().rstrip("\n"), safe=""))')@10.10.1.73/gjesus3" /Users/molecubes/.gjesus3
