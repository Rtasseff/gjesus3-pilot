[gjesus3]
# MacMounter entry: keeps gjesus3 mounted on the NI Mac for the NI live sync.
# Data Office (Ryan Tasseff), 2026-10-08. INTERIM, with the Data Office login, until Box A pulls
# the data through the tunnel and this mount is retired (tasks/RESUME_ni_live.md, "The gjesus3 mount").
# Installed by setup.sh, removed by undo.sh (both in gnuclear 2026/Jesus/Ryan/gjesus3-mount/).
# The mounting itself is done by ~/.macmounter/gjesus3-mount.py, which serializes the three
# MacMounter copies on this Mac (two of them stacked a second mount on 2026-10-08), clears dead
# layers, and reads the password from the login keychain.
RECHECK_INTERVAL_SECONDS=120
PING_CMD=/usr/bin/nc -z -G 3 10.10.1.73 445
MOUNT_TEST_CMD=/bin/test -d /Users/molecubes/.gjesus3/gjesus3-data/registries
MOUNT_CMD=/usr/local/bin/python3 /Users/molecubes/.macmounter/gjesus3-mount.py
